# Stand-in for the bank's Active Directory, read by app/auth/ldap.py on every sign-in.
#
# DEMO ONLY: passwords are plain text and compared exactly as written. In production the
# password check is a bind against the real directory and no password is stored anywhere.
#
# Keys are LAN IDs (lower-case). Each user needs: password, display_name, email, department, title.
# Edits take effect at the next sign-in; no restart needed.
#
# The directory only says who someone is. What they may do in Data Hub (system roles, department
# roles, doc-repo roles) is given in Data Hub itself: Administration -> Users, or a doc-repo's
# Members tab. The "intended role" comments below are the demo set-up each user is meant for.
#
# Passwords: admin123 (admin), datahub123 (analyst), demo123 (everyone else).

users:
  # ---------------------------------------------------------------- Technology
  admin:  # intended role: system admin (seeded at start-up: bootstrap_system_admins)
    password: admin123
    display_name: Data Hub Admin
    email: admin@datahub.local
    department: Technology
    title: Platform Administrator

  it.admin:  # intended role: a second system admin (so one system admin can manage the other)
