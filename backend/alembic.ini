# Alembic: database migrations for Data Hub. Run from backend/:
#
#   .venv/bin/alembic upgrade head                          bring the database up to date
#   .venv/bin/alembic current                               which migration the database is at
#   .venv/bin/alembic revision --autogenerate -m "..."      draft a migration from model changes (review it!)
#   .venv/bin/alembic downgrade -1                          undo the last migration
#
# The database URL comes from the app's settings (DATAHUB_DATABASE_URL or backend/.env), not this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Files are named <revision>_<slug>.py, e.g. 0002_add_audit_events.py (pass --rev-id 0002).
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
