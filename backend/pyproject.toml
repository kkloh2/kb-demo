[project]
name = "data-hub-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
